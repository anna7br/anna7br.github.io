function badge(lab,c,v,m,p){var st=(v||p)?"color:"+c+";border-color:"+c:"background:"+c+";color:"+txt(c);if(m)st+=";box-shadow:0 0 0 1.5px var(--land),0 0 0 3px "+c+",0 0 0 4.5px var(--land)";return '<span class="badge'+(v?" v":"")+(p?" p":"")+'" style="'+st+'">'+esc(lab)+(p?"?":"")+'</span>';}
function pop(o,planned){
 var h='<div class="pop"><div class="id">'+esc(o.l)+' · '+GA[o.g]+(o.v?' · Variante':'')+(planned?' · noch ohne Track':'')+'</div><h4>'+esc(o.nm)+'</h4><dl>';
 if(!planned) h+='<dt>Strecke</dt><dd>'+f(rKm(o.km))+' km · ↑ '+f(rHm(o.up))+' · ↓ '+f(rHm(o.dn))+' Hm</dd>';
 h+='<dt>Schwierigkeit</dt><dd>'+DL[dOf(o)]+'</dd>'+(o.m?'<dt>Art</dt><dd>Mehrtagestour</dd>':'')+'</dl>';
 if(planned) h+='<div class="note">Lage ungefähr</div>';
 if(o.url) h+='<a href="'+esc(o.url)+'" target="_blank" rel="noopener">Tour auf Bahn zum Berg ↗</a>';
 return h+'</div>';
}
function draw(){
 layer.clearLayers();
 GK.forEach(function(k){gauPolys[k].setStyle({fillOpacity:mode==="gau"?.07:0});});
 D.tracks.slice().sort(function(a,b){return b.v-a.v;}).forEach(function(t){
  var c=col(t);
  L.polyline(t.c,{color:C("land"),weight:t.v?5:6.5,opacity:.9,interactive:false}).addTo(layer);
  var ln=L.polyline(t.c,{color:c,weight:t.v?2.6:3.6,dashArray:t.v?"6 6":null}).addTo(layer);
  var hit=L.polyline(t.c,{color:"#000",weight:14,opacity:0}).addTo(layer);
  hit.bindTooltip("<b>"+esc(t.l)+"</b> "+esc(t.nm),{sticky:true,direction:"top"}); hit.bindPopup(pop(t,false),{maxWidth:300});
  var s=t.c[0],p=t.v?s[Math.floor(s.length/2)]:s[0];
  L.marker(p,{icon:L.divIcon({className:"",iconSize:[0,0],html:badge(t.l,c,t.v,t.m,false)})}).bindPopup(pop(t,false),{maxWidth:300}).addTo(layer);
 });
 D.planned.forEach(function(o){var c=col(o);
  L.circleMarker(o.p,{radius:18,color:c,weight:2,dashArray:"2 5",fillColor:c,fillOpacity:.08,interactive:false}).addTo(layer);
  L.marker(o.p,{icon:L.divIcon({className:"",iconSize:[0,0],html:badge(o.l,c,false,o.m,true)})}).bindPopup(pop(o,true),{maxWidth:300}).addTo(layer);});
 legend(); side();
}
function stats(){var s={main:0,vars:0,g:{},d:{leicht:0,mittel:0,schwierig:0,none:0}};GK.forEach(function(k){s.g[k]={main:0,vars:0,d:{leicht:0,mittel:0,schwierig:0,none:0}};});
 D.tracks.forEach(function(t){var G=s.g[t.g];if(t.v){s.vars++;G.vars++;return;}s.main++;G.main++;G.d[dOf(t)]++;s.d[dOf(t)]++;});return s;}
function legend(){var s=stats(),h='<div class="t">'+(mode==="gau"?"Touren nach Gau":"Touren nach Schwierigkeit")+'</div>';
 if(mode==="gau") GK.forEach(function(k){h+='<div class="r"><span class="li" style="color:'+GC[k]+'"></span><span>'+GA[k]+'</span><span>'+s.g[k].main+(s.g[k].vars?'<span class="v"> +'+s.g[k].vars+'</span>':'')+'</span></div>';});
 else DK.forEach(function(d){h+='<div class="r"><span class="li" style="color:'+DC[d]+'"></span><span>'+DL[d]+'</span><span>'+s.d[d]+'</span></div>';});
 h+='<div class="f"><span class="li d"></span>Variante (zählt nicht)</div><div class="f" style="border:0;margin:0;padding:0"><span class="ph"></span>geplant, noch ohne Track</div><div class="f" style="border:0;margin:0;padding:0"><span class="mb"></span>Mehrtagestour</div>';
 document.getElementById("legend").innerHTML=h;}
function side(){var s=stats(),h='<div class="big"><b>'+s.main+'</b><div><strong>Touren</strong> mit Track<br>+ '+s.vars+' Varianten · '+D.planned.length+' geplant</div></div>';
 h+='<section><h2>Gau × Schwierigkeit</h2><table><thead><tr><th>Gau</th>'+DK.map(function(d){return '<th><span class="sw" style="background:'+DC[d]+'"></span>'+(d==="none"?"o. A.":d.slice(0,4)+".")+'</th>';}).join("")+'<th>Σ</th><th>Var.</th></tr></thead><tbody>';
 GK.forEach(function(k){var G=s.g[k];h+='<tr><td><span class="sw" style="background:'+GC[k]+'"></span>'+GA[k]+'</td>'+DK.map(function(d){return '<td class="'+(G.d[d]?"":"z")+'">'+G.d[d]+'</td>';}).join("")+'<td><b>'+G.main+'</b></td><td>'+G.vars+'</td></tr>';});
 h+='</tbody><tfoot><tr><td>Salzburg</td>'+DK.map(function(d){return '<td>'+s.d[d]+'</td>';}).join("")+'<td>'+s.main+'</td><td>'+s.vars+'</td></tr></tfoot></table></section>';
 h+='<p class="hint">Arbeitsstand vom '+esc(D.asof)+'. Strecken und Höhenmeter gerundet. Varianten sind strichliert, geplante Touren ohne Track punktiert an ungefährer Lage.</p>';
 document.getElementById("side").innerHTML=h;}
document.querySelectorAll(".seg button").forEach(function(b){b.addEventListener("click",function(){mode=b.dataset.m;document.querySelectorAll(".seg button").forEach(function(x){x.setAttribute("aria-pressed",x===b?"true":"false");});draw();});});
draw();
})();
</script>
</body>
</html>
